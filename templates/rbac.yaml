apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "superagent.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "superagent.labels" . | nindent 4 }}
{{- with .Values.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "superagent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "superagent.labels" . | nindent 4 }}
# host-app creates/deletes agent pods + services in this namespace, and reads its
# own pod (for the ownerReference used to GC orphaned agents). It never touches
# Secrets: agent secrets are passed as env, not via the Secret API.
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "superagent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "superagent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "superagent.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "superagent.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
