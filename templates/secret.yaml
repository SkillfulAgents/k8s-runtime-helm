{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "superagent.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "superagent.labels" . | nindent 4 }}
type: Opaque
{{- with .Values.secrets.env }}
stringData:
  {{- range $key, $value := . }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
{{- end }}
